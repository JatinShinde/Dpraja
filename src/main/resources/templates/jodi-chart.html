<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>DPRAJA.COM | [[${gameName}]]</title>
    <style>
        body { background-color: #FDFBF7; font-family: sans-serif; text-align: center; margin: 0; }
        .brand { background: #1E293B; color: #fff; padding: 15px; font-weight: 900; font-size: 20px; }
        .chart-title { background: #1E293B; color: #fff; padding: 10px; font-weight: bold; margin: 10px auto; width: 95%; }
        table { width: 95%; margin: 0 auto; border-collapse: collapse; background: #FFFFFF; }
        th, td { border: 1px solid #CBD5E1; padding: 10px; text-align: center; font-weight: bold; }
        th { background: #F7F4EC; color: #1E293B; }
        .jodi-val { color: #1E293B; font-size: 18px; font-weight: bold; }
        .jodi-val.red-jodi { color: #B91C1C !important; }
    </style>
</head>
<body>
    <div class="brand">DPRAJA.COM</div>
    <div class="chart-title">[[${gameName}]] JODI CHART</div>

    <table>
        <thead>
            <tr>
                <th style="width: 15%;">Date</th>
                <th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="week : ${weeks}">
                <td style="background: #F7F4EC; color: #1E293B; font-size: 11px; line-height: 1.3;">
                    <span th:text="${#temporals.format(week.key, 'dd/MM/yyyy')}"></span><br>to<br>
                    <span th:text="${#temporals.format(week.key.plusDays(6), 'dd/MM/yyyy')}"></span>
                </td>
                <td th:each="dayOffset : ${#numbers.sequence(0, 6)}">
                    <div th:with="targetDate=${week.key.plusDays(dayOffset)}, dayName=${#temporals.format(week.key.plusDays(dayOffset), 'E')}">
                        <!-- If closed, show red double slash -->
                        <span th:if="${!activeDays.contains(dayName)}" style="color: #B91C1C; font-size: 18px; font-weight: bold;">-</span>
                        
                        <!-- If open, check results -->
                        <div th:if="${activeDays.contains(dayName)}" style="display:inline;">
                            <span class="jodi-val" 
                                  th:each="record : ${week.value}"
                                  th:if="${#temporals.format(record.resultDate, 'yyyy-MM-dd') == #temporals.format(targetDate, 'yyyy-MM-dd')}" 
                                  th:classappend="${record.isRedJodi() ? 'red-jodi' : ''}"
                                  th:text="${record.jodi}"></span>
                        </div>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
