<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>DPRAJA.COM | [[${gameName}]]</title>
    <style>
        body { background-color: #FDFBF7; font-family: sans-serif; text-align: center; margin: 0; }
        .brand { background: #1E293B; color: #fff; padding: 15px; font-weight: 900; font-size: 20px; }
        .chart-title { background: #1E293B; color: #fff; padding: 10px; font-weight: bold; margin: 10px auto; width: 95%; }
        table { width: 95%; margin: 0 auto; border-collapse: collapse; background: #FFFFFF; }
        th, td { border: 1px solid #CBD5E1; padding: 10px; text-align: center; font-weight: bold; }
        th { background: #F7F4EC; color: #1E293B; }
        .jodi-val { color: #1E293B; font-size: 18px; font-weight: bold; }
        .jodi-val.red-jodi { color: #B91C1C !important; }
        .edit-banner { background: #B91C1C; color: #fff; padding: 12px; margin: 10px auto; width: 95%; border-radius: 6px; box-sizing: border-box; }
        .edit-form { display: flex; justify-content: center; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
        .edit-form input { padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; }
        .edit-form button { background: #1E293B; color: white; padding: 6px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="brand">DPRAJA.COM</div>
    <div class="chart-title">[[${gameName}]] JODI CHART</div>

    <!-- ADMIN EDIT MODE BAR -->
    <div th:if="${isEditMode}" class="edit-banner">
        <div style="font-weight: bold; font-size: 16px;">✏️ ADMIN EDIT MODE - EDIT JODI CHART</div>
        <div th:if="${successMsg}" style="color: #4ADE80; font-weight: bold; margin-top: 4px;" th:text="${successMsg}"></div>
        <div th:if="${errorMsg}" style="color: #F87171; font-weight: bold; margin-top: 4px;" th:text="${errorMsg}"></div>
        <form th:action="@{/admin/update-jodi-history}" method="post" class="edit-form">
            <input type="hidden" name="gameName" th:value="${gameName}">
            <label style="color: white; font-size: 14px;">Date:</label>
            <input type="date" id="jodiResultDate" name="resultDate" required th:value="${currentDate}">
            <label style="color: white; font-size: 14px;">Jodi:</label>
            <input type="text" id="jodiValInput" name="jodi" placeholder="e.g. 58" style="width: 80px;" required>
            <button type="submit">Save Jodi</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 15%;">Date</th>
                <th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="week : ${weeks}">
                <td style="background: #F7F4EC; color: #1E293B; font-size: 11px; line-height: 1.3;">
                    <span th:text="${#temporals.format(week.key, 'dd/MM/yyyy')}"></span><br>to<br>
                    <span th:text="${#temporals.format(week.key.plusDays(6), 'dd/MM/yyyy')}"></span>
                </td>
                <td th:each="dayOffset : ${#numbers.sequence(0, 6)}">
                    <div th:with="targetDate=${week.key.plusDays(dayOffset)}, dayName=${#strings.capitalize(#strings.toLowerCase(#strings.substring(targetDate.dayOfWeek.name(), 0, 3)))}">
                        <!-- If closed, show red double slash -->
                        <span th:if="${!activeDays.contains(dayName)}" style="color: #B91C1C; font-size: 18px; font-weight: bold;">-</span>
                        
                        <!-- If open, check results -->
                        <div th:if="${activeDays.contains(dayName)}" style="display:inline;"
                             th:attr="onclick=${isEditMode} ? 'setJodiEdit(''' + ${targetDate} + ''')' : null"
                             th:style="${isEditMode} ? 'cursor: pointer;' : ''">
                            <span class="jodi-val" 
                                  th:each="record : ${week.value}"
                                  th:if="${record.resultDate != null and record.resultDate.equals(targetDate)}" 
                                  th:classappend="${record.isRedJodi() ? 'red-jodi' : ''}"
                                  th:text="${record.jodi}"
                                  th:attr="data-jodi=${record.jodi}"></span>
                        </div>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <script th:if="${isEditMode}">
        function setJodiEdit(dateStr) {
            document.getElementById('jodiResultDate').value = dateStr;
            const clickedCell = event.currentTarget;
            const valSpan = clickedCell.querySelector('.jodi-val');
            document.getElementById('jodiValInput').value = valSpan ? valSpan.innerText.trim() : '';
            document.getElementById('jodiValInput').focus();
        }
    </script>
</body>
</html>
