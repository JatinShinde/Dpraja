<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Game | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a1a; color: white; padding: 50px; }
        .edit-card { background-color: #222; border: 2px solid #9c27b0; border-radius: 20px; padding: 30px; max-width: 500px; margin: auto; }
        .form-control { background-color: #333; border: 1px solid #444; color: white; margin-bottom: 15px; }
        .btn-save { background: linear-gradient(#7b2ff7, #4b0082); color: white; border: none; width: 100%; padding: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="edit-card shadow">
        <h3 class="mb-4 text-center" th:text="'Update ' + ${game.gameName}">Update Game</h3>
        
        <form th:action="@{/admin/update-game}" th:object="${game}" method="post">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{gameName}">

            <label>Open Panel (3 Digits)</label>
            <input type="text" th:field="*{openPanel}" class="form-control" placeholder="e.g. 389">

            <label>Jodi (2 Digits)</label>
            <input type="text" th:field="*{jodi}" class="form-control" placeholder="e.g. 04">

            <label>Close Panel (3 Digits)</label>
            <input type="text" th:field="*{closePanel}" class="form-control" placeholder="e.g. 680">

            <label>Result Time</label>
            <input type="text" th:field="*{resultTime}" class="form-control" placeholder="e.g. 11:35 AM --- 12:35 PM">

            <button type="submit" class="btn btn-save mt-3">SAVE UPDATES</button>
            <a href="/admin" class="btn btn-link w-100 text-secondary mt-2">Cancel</a>
        </form>
    </div>
</body>
</html>
