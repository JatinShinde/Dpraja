<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>DPRAJA.COM | [[${gameName}]]</title>
    <style>
        body { background-color: #FDFBF7; font-family: sans-serif; margin: 0; text-align: center; }
        .brand { background: #1E293B; color: #fff; padding: 15px; font-weight: 900; font-size: 22px; }
        .title-bar { background: #1E293B; color: #fff; padding: 10px; font-weight: bold; width: 98%; margin: 10px auto; }
        table { width: 98%; margin: 0 auto; border-collapse: collapse; background: #FFFFFF; }
        th, td { border: 1px solid #CBD5E1; padding: 5px; text-align: center; height: 60px; vertical-align: middle; }
        th { background: #F7F4EC; color: #1E293B; font-size: 14px; font-weight: bold; }
        .date-col { background: #F7F4EC; color: #1E293B; font-weight: bold; font-size: 11px; line-height: 1.3; }
        
        /* THE PANEL CELL LAYOUT */
        .panel-cell {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-weight: bold;
        }
        
        .stacked-digits {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            line-height: 1.1;
            color: #334155;
            font-weight: bold;
            min-width: 14px;
        }
        
        .stacked-digits span {
            display: block;
            text-align: center;
        }
        
        .jodi-display {
            font-size: 20px;
            font-weight: 900;
            color: #1E293B;
            min-width: 24px;
            text-align: center;
        }
        
        .jodi-display.red-jodi {
            color: #B91C1C !important;
        }

        .edit-banner { background: #B91C1C; color: #fff; padding: 12px; margin: 10px auto; width: 98%; border-radius: 6px; box-sizing: border-box; }
        .edit-form { display: flex; justify-content: center; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
        .edit-form input { padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; }
        .edit-form button { background: #1E293B; color: white; padding: 6px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="brand">DPRAJA.COM</div>
    <div class="title-bar">[[${gameName}]] PANEL CHART</div>

    <!-- ADMIN EDIT MODE BAR -->
    <div th:if="${isEditMode}" class="edit-banner">
        <div style="font-weight: bold; font-size: 16px;">✏️ ADMIN EDIT MODE - EDIT PANEL CHART</div>
        <div th:if="${successMsg}" style="color: #4ADE80; font-weight: bold; margin-top: 4px;" th:text="${successMsg}"></div>
        <div th:if="${errorMsg}" style="color: #F87171; font-weight: bold; margin-top: 4px;" th:text="${errorMsg}"></div>
        <form th:action="@{/admin/update-panel-history}" method="post" class="edit-form">
            <input type="hidden" name="gameName" th:value="${gameName}">
            <label style="color: white; font-size: 14px;">Date:</label>
            <input type="date" id="panelResultDate" name="resultDate" required th:value="${currentDate}">
            <label style="color: white; font-size: 14px;">Open Pana:</label>
            <input type="text" id="openPanaInput" name="openPanel" placeholder="e.g. 128" style="width: 70px;">
            <label style="color: white; font-size: 14px;">Jodi:</label>
            <input type="text" id="panelJodiInput" name="jodi" placeholder="e.g. 58" style="width: 60px;">
            <label style="color: white; font-size: 14px;">Close Pana:</label>
            <input type="text" id="closePanaInput" name="closePanel" placeholder="e.g. 350" style="width: 70px;">
            <button type="submit">Save Panel</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 15%;">Date</th>
                <th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="week : ${weeks}">
                <td class="date-col">
                    <span th:text="${#temporals.format(week.key, 'dd/MM/yyyy')}"></span><br>to<br>
                    <span th:text="${#temporals.format(week.key.plusDays(6), 'dd/MM/yyyy')}"></span>
                </td>
                
                <td th:each="dayOffset : ${#numbers.sequence(0, 6)}">
                    <div th:with="targetDate=${week.key.plusDays(dayOffset)}, dayName=${#strings.capitalize(#strings.toLowerCase(#strings.substring(targetDate.dayOfWeek.name(), 0, 3)))}">
                        <!-- If closed, show red double slash -->
                        <span th:if="${!activeDays.contains(dayName)}" style="color: #B91C1C; font-size: 20px; font-weight: bold;">-</span>
                        
                        <!-- If open, check results -->
                        <div th:if="${activeDays.contains(dayName)}">
                            <div class="panel-cell" th:each="record : ${week.value}" th:if="${record.resultDate != null and record.resultDate.equals(targetDate)}"
                                 th:attr="onclick=${isEditMode} ? 'setPanelEdit(''' + ${targetDate} + ''', ''' + ${record.openPanel} + ''', ''' + ${record.jodi} + ''', ''' + ${record.closePanel} + ''')' : null"
                                 th:style="${isEditMode} ? 'cursor: pointer;' : ''">
                                
                                <!-- Left stacked digits (Open Panel) -->
                                <div class="stacked-digits">
                                    <span th:if="${record.openPanel != null and record.openPanel.length() == 3}" th:text="${#strings.substring(record.openPanel, 0, 1)}"></span>
                                    <span th:if="${record.openPanel != null and record.openPanel.length() == 3}" th:text="${#strings.substring(record.openPanel, 1, 2)}"></span>
                                    <span th:if="${record.openPanel != null and record.openPanel.length() == 3}" th:text="${#strings.substring(record.openPanel, 2, 3)}"></span>
                                    <span th:if="${record.openPanel == null or record.openPanel.length() != 3}">-</span>
                                </div>
                                
                                <!-- Middle Jodi -->
                                <div class="jodi-display" th:classappend="${record.isRedJodi() ? 'red-jodi' : ''}" th:text="${record.jodi ?: '--'}"></div>
                                
                                <!-- Right stacked digits (Close Panel) -->
                                <div class="stacked-digits">
                                    <span th:if="${record.closePanel != null and record.closePanel.length() == 3}" th:text="${#strings.substring(record.closePanel, 0, 1)}"></span>
                                    <span th:if="${record.closePanel != null and record.closePanel.length() == 3}" th:text="${#strings.substring(record.closePanel, 1, 2)}"></span>
                                    <span th:if="${record.closePanel != null and record.closePanel.length() == 3}" th:text="${#strings.substring(record.closePanel, 2, 3)}"></span>
                                    <span th:if="${record.closePanel == null or record.closePanel.length() != 3}">-</span>
                                </div>
                                
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <script th:if="${isEditMode}">
        function setPanelEdit(dateStr, openPana, jodiVal, closePana) {
            document.getElementById('panelResultDate').value = dateStr;
            document.getElementById('openPanaInput').value = (openPana && openPana !== 'null') ? openPana : '';
            document.getElementById('panelJodiInput').value = (jodiVal && jodiVal !== 'null') ? jodiVal : '';
            document.getElementById('closePanaInput').value = (closePana && closePana !== 'null') ? closePana : '';
            document.getElementById('openPanaInput').focus();
        }
    </script>
</body>
</html>
