<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Matka Result History | DPRAJA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #FDFBF7; color: #1E293B; font-family: 'Segoe UI', sans-serif; text-align: center; }
        .header-box { background-color: #1E293B; color: #FFFFFF; padding: 20px; border-bottom: 3px solid #B91C1C; margin-bottom: 30px; }
        .history-table { width: 95%; margin: auto; background-color: #FFFFFF; border: 1px solid #CBD5E1; color: #1E293B; }
        .history-table th { background-color: #1E293B; color: white; padding: 12px; border: 1px solid #CBD5E1; }
        .history-table td { border: 1px solid #CBD5E1; padding: 10px; font-weight: bold; }
        .game-name-cell { color: #1E293B; text-transform: uppercase; font-weight: 900; }
        .result-cell { color: #B91C1C; letter-spacing: 2px; font-weight: 900; }
        .date-cell { color: #8c949c; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header-box shadow">
        <h2 style="font-weight: 900;">ALL MATKA RESULT HISTORY</h2>
        <p th:text="'Updated as of: ' + ${#temporals.format(currentDate, 'dd-MM-yyyy')}"></p>
        <a href="/" class="btn btn-outline-light btn-sm">← Back to Home</a>
    </div>

    <div class="container-fluid">
        <table class="table history-table shadow">
            <thead>
                <tr>
                    <th>Date Range</th>
                    <th>Game Name</th>
                    <th>Open Panel</th>
                    <th>Jodi</th>
                    <th>Close Panel</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="record : ${history}">
                    <td class="date-cell" th:text="${record.startDate + ' to ' + record.endDate}">01/01/2026 to 07/01/2026</td>
                    <td class="game-name-cell" th:text="${record.gameName}">KALYAN</td>
                    <td th:text="${record.open1 + record.open2 + record.open3}">123</td>
                    <td class="result-cell" th:text="${record.jodi}">45</td>
                    <td th:text="${record.close1 + record.close2 + record.close3}">678</td>
                </tr>
                <tr th:if="${#lists.isEmpty(history)}">
                    <td colspan="5" class="text-muted">No historical data found.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <footer class="mt-5 mb-4 text-muted" style="font-size: 0.8rem;">
        © 2026 Dpraja.com | All Rights Reserved
    </footer>

</body>
</html>
