# 1. MySQL Connection Details
# Make sure your database 'spdpboss_db' actually exists in MySQL Workbench!
spring.datasource.url=jdbc:mysql://localhost:3306/spdpboss_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=1885
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# 4. Web Server Port
server.port=8082
server.address=0.0.0.0

# Increase maximum file upload sizes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 6. H2 Console (Disable this if using MySQL to avoid errors)
spring.h2.console.enabled=false

spring.thymeleaf.cache=false